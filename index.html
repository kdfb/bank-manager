<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bank Manager</title>
  <style>
    /* ── Reset & tokens ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1923;
      --card:    #1a2634;
      --border:  #263545;
      --green:   #2ecc71;
      --red:     #e74c3c;
      --yellow:  #f1c40f;
      --blue:    #3498db;
      --purple:  #9b59b6;
      --text:    #ecf0f1;
      --muted:   #7f8c8d;
      --radius:  14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 32px;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #111e2b;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--blue);
    }

    /* day label row: "Day 3  ⏱ 1:24" */
    .day-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .day-row p {
      font-size: 12px;
      color: var(--muted);
    }

    .day-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Day timer bar (sticky strip below header) ────────────── */
    .day-timer-wrap {
      position: sticky;
      top: 57px;
      z-index: 9;
      height: 4px;
      background: var(--border);
    }

    .day-timer-fill {
      height: 4px;
      width: 100%;          /* JS will shrink this */
      background: var(--blue);
    }

    /* ── Per-event timer bar (inside event card) ──────────────── */
    .ev-timer-wrap {
      height: 3px;
      background: var(--border);
    }

    .ev-timer-fill {
      height: 3px;
      width: 100%;          /* JS will shrink this */
      background: var(--blue);
    }

    .header-right {
      text-align: right;
    }

    .header-right .label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-right .value {
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
    }

    /* ── Stats grid ───────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .stat.full-width {
      grid-column: 1 / -1;
    }

    .stat .label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 800;
    }

    .stat .value.green  { color: var(--green); }
    .stat .value.red    { color: var(--red); }
    .stat .value.yellow { color: var(--yellow); }
    .stat .value.blue   { color: var(--blue); }

    /* Reputation bar */
    .rep-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .rep-track {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .rep-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--green);
      width: 60%;           /* JS will update this */
      transition: width 0.5s ease, background-color 0.5s;
    }

    /* ── Event card ───────────────────────────────────────────── */
    .section {
      padding: 0 12px 12px;
    }

    .section-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .event-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .event-icon {
      font-size: 28px;
      line-height: 1;
    }

    .event-meta .type {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .event-meta .title {
      font-size: 16px;
      font-weight: 700;
      margin-top: 2px;
    }

    .event-body {
      padding: 4px 0;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-row .key   { color: var(--muted); }
    .detail-row .val   { font-weight: 600; }
    .detail-row .val.green  { color: var(--green); }
    .detail-row .val.red    { color: var(--red); }
    .detail-row .val.yellow { color: var(--yellow); }

    /* ── Buttons ──────────────────────────────────────────────── */
    .btn-row {
      display: grid;
      gap: 10px;
      padding: 12px 16px 16px;
    }

    .btn-row.two-col { grid-template-columns: 1fr 1fr; }
    .btn-row.one-col { grid-template-columns: 1fr; }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 15px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, opacity 0.15s;
    }

    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    .btn-green  { background: var(--green);  color: #fff; }
    .btn-dark   { background: var(--border); color: var(--text); }
    .btn-blue   { background: var(--blue);   color: #fff; }
    .btn-purple {
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff;
    }

    .cant-fund {
      margin: 0 16px 6px;
      padding: 8px 10px;
      background: rgba(231,76,60,0.15);
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 8px;
      font-size: 12px;
      color: var(--red);
    }

    /* ── Progress dots ────────────────────────────────────────── */
    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      padding: 8px 0 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }

    .dot.done    { background: var(--green); }
    .dot.current { background: var(--blue); }

    /* ── Activity log ─────────────────────────────────────────── */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      background: var(--card);
      border-radius: 10px;
      border-left: 3px solid var(--border);
      padding: 9px 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .log-item .day-tag {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .log-item.good    { border-left-color: var(--green); }
    .log-item.bad     { border-left-color: var(--red); }
    .log-item.warn    { border-left-color: var(--yellow); }
    .log-item.neutral { border-left-color: var(--blue); }

    /* ── End-of-day card ──────────────────────────────────────── */
    .eod-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .eod-row:last-of-type { border-bottom: none; }
    .eod-row .key { color: var(--muted); }

    /* ── Overlay (win / lose) ─────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay.show { display: flex; }

    .overlay-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 24px 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }

    .overlay-icon  { font-size: 60px; margin-bottom: 14px; }

    .overlay-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .overlay-title.win  { color: var(--green); }
    .overlay-title.lose { color: var(--red); }

    .overlay-body {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .overlay-stats { margin-bottom: 24px; }

    .overlay-stat {
      font-size: 14px;
      color: var(--muted);
      margin: 5px 0;
    }

    .overlay-stat strong { color: var(--text); font-weight: 700; }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <h1>🏦 First National Bank</h1>
      <div class="day-row">
        <p id="dayLabel">Day 1</p>
        <span class="day-time" id="dayTime">1:30</span>
      </div>
    </div>
    <div class="header-right">
      <div class="label">Net Worth</div>
      <div class="value" id="netWorth">$200,000</div>
    </div>
  </header>

  <!-- ── Day timer bar ─────────────────────────────────────────── -->
  <div class="day-timer-wrap">
    <div class="day-timer-fill" id="dayTimerFill"></div>
  </div>

  <!-- ── Stats ──────────────────────────────────────────────── -->
  <div class="stats">
    <div class="stat">
      <div class="label">Cash Reserves</div>
      <div class="value green" id="statCash">$500,000</div>
    </div>
    <div class="stat">
      <div class="label">Loans Out</div>
      <div class="value blue" id="statLoans">$0</div>
    </div>
    <div class="stat">
      <div class="label">Deposits Owed</div>
      <div class="value yellow" id="statDeposits">$300,000</div>
    </div>
    <div class="stat">
      <div class="label">Total Profit</div>
      <div class="value green" id="statProfit">$0</div>
    </div>
    <div class="stat full-width">
      <div class="rep-row">
        <div class="label">Reputation</div>
        <div class="value green" id="statRep" style="font-size:15px">60 / 100</div>
      </div>
      <div class="rep-track">
        <div class="rep-fill" id="repFill"></div>
      </div>
    </div>
  </div>

  <!-- ── Current event ──────────────────────────────────────── -->
  <div class="section">
    <div class="section-label">Today's Event</div>
    <div class="event-card" id="eventCard">
      <!-- Populated by JS -->
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- ── Activity log ───────────────────────────────────────── -->
  <div class="section">
    <div class="section-label">Activity Log</div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- ── Win / Lose overlay ─────────────────────────────────── -->
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="overlay-icon"  id="overlayIcon"></div>
      <div class="overlay-title" id="overlayTitle"></div>
      <div class="overlay-body"  id="overlayBody"></div>
      <div class="overlay-stats" id="overlayStats"></div>
      <div class="btn-row one-col">
        <button class="btn btn-blue" onclick="restartGame()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────
    const STARTING_CASH       = 500_000;
    const STARTING_DEPOSITS   = 300_000;
    const STARTING_REP        = 60;
    const DAILY_OVERHEAD      = 2_000;
    const DAY_DURATION        = 90;    // real seconds per game day
    const EVENT_TIMEOUT       = 20;    // real seconds before an event auto-resolves

    // ── Bank state ─────────────────────────────────────────────
    let bank = {};

    // ── Timer state ────────────────────────────────────────────
    let rafId      = null;   // requestAnimationFrame handle
    let dayStart   = 0;      // Date.now() when current day began
    let eventStart = 0;      // Date.now() when current event appeared

    function initBank() {
      bank = {
        cash:       STARTING_CASH,
        deposits:   STARTING_DEPOSITS,
        loansOut:   0,
        loanBook:   [],   // active loans
        rep:        STARTING_REP,
        day:        1,
        profit:     0,
      };
    }

    const totalAssets = () => bank.cash + bank.loansOut;
    const netWorth    = () => totalAssets() - bank.deposits;

    // ── Timer functions ────────────────────────────────────────
    function startTimers() {
      stopTimers();
      dayStart   = Date.now();
      eventStart = Date.now();
      rafId = requestAnimationFrame(tick);
    }

    function stopTimers() {
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function resetEventTimer() {
      eventStart = Date.now();
    }

    function tick() {
      const now        = Date.now();
      const dayElapsed = (now - dayStart) / 1000;
      const evElapsed  = (now - eventStart) / 1000;
      const dayLeft    = Math.max(0, DAY_DURATION - dayElapsed);
      const dayPct     = dayLeft / DAY_DURATION;

      // Day timer bar colour: blue → yellow → red as time runs out
      const dayColour =
        dayPct > 0.4 ? "var(--blue)" : dayPct > 0.15 ? "var(--yellow)" : "var(--red)";

      const dayFill = document.getElementById("dayTimerFill");
      if (dayFill) {
        dayFill.style.width      = `${dayPct * 100}%`;
        dayFill.style.background = dayColour;
      }

      // Countdown label "M:SS"
      const timeEl = document.getElementById("dayTime");
      if (timeEl) {
        const m = Math.floor(dayLeft / 60);
        const s = Math.floor(dayLeft % 60);
        timeEl.textContent  = `${m}:${s.toString().padStart(2, "0")}`;
        timeEl.style.color  = dayColour;
      }

      // Per-event timer bar (only while an event is on screen)
      if (qIdx < queue.length) {
        const evLeft = Math.max(0, EVENT_TIMEOUT - evElapsed);
        const evPct  = evLeft / EVENT_TIMEOUT;
        const evColour =
          evPct > 0.5 ? "var(--blue)" : evPct > 0.25 ? "var(--yellow)" : "var(--red)";
        const evFill = document.getElementById("evTimerFill");
        if (evFill) {
          evFill.style.width      = `${evPct * 100}%`;
          evFill.style.background = evColour;
        }
      }

      // Auto-resolve and day-advance logic comes in Step 3.
      rafId = requestAnimationFrame(tick);
    }

    // ── Utilities ──────────────────────────────────────────────
    const fmt     = n   => '$' + Math.round(n).toLocaleString();
    const pick    = arr => arr[Math.floor(Math.random() * arr.length)];
    const randInt = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;

    // ── Data pools ─────────────────────────────────────────────
    const NAMES = [
      "Alice Mwangi","Bob Okonkwo","Carmen Reyes","David Patel",
      "Elena Ivanova","Frank Johansson","Grace Liu","Hiro Tanaka",
      "Isabelle Morin","James Osei","Keiko Sato","Liam Nkosi",
    ];

    const PURPOSES = [
      "a new business","a home renovation","a car purchase",
      "an education fund","a medical expense","farm equipment",
      "a restaurant opening","solar panel installation",
    ];

    const DEPOSITORS = [
      "Sunrise Corp","Green Valley Farm","City Pension Fund",
      "Dr. Al-Rashid","The Goldstein Trust","Metro Retailers",
      "Harbour Logistics","Blue Peak Holdings",
    ];

    const RANDOM_EVENTS = [
      {
        icon:"📋", title:"Audit Passed",
        desc:"Regulators gave your books a clean bill of health.",
        effect: b => { b.rep = Math.min(100, b.rep + 5); },
        msg: "Reputation +5", kind:"good",
      },
      {
        icon:"📰", title:"Positive Press",
        desc:"A reporter praised your community lending program.",
        effect: b => { b.rep = Math.min(100, b.rep + 3); },
        msg: "Reputation +3", kind:"good",
      },
      {
        icon:"📉", title:"Economic Downturn",
        desc:"Markets fell. Several borrowers are struggling to repay.",
        effect: b => {
          const loss = Math.min(b.loansOut, 15_000);
          b.loansOut -= loss;
          b.profit   -= loss;
        },
        msg: "Loan write-down: −$15,000", kind:"bad",
      },
      {
        icon:"🔫", title:"Robbery Attempt",
        desc:"Armed robbers hit the vault. Security held them off — barely.",
        effect: b => {
          const loss = Math.min(b.cash, 8_000);
          b.cash -= loss;
          b.profit -= loss;
          b.rep = Math.max(0, b.rep - 4);
        },
        msg: "Cash −$8,000 · Reputation −4", kind:"bad",
      },
      {
        icon:"💡", title:"Central Bank Rate Cut",
        desc:"Lower rates mean your deposit interest costs drop slightly.",
        effect: b => { b.deposits = Math.max(0, b.deposits - 5_000); },
        msg: "Deposit liability −$5,000", kind:"good",
      },
      {
        icon:"🔍", title:"Fraud Attempt Foiled",
        desc:"A sharp teller caught a forged cheque before it cleared.",
        effect: () => {},
        msg: "Crisis averted — no loss.", kind:"neutral",
      },
      {
        icon:"⚠️", title:"Compliance Fine",
        desc:"Regulators flagged a paperwork issue. You must pay a fine.",
        effect: b => {
          b.cash   -= 5_000;
          b.profit -= 5_000;
          b.rep = Math.max(0, b.rep - 3);
        },
        msg: "Fine −$5,000 · Reputation −3", kind:"bad",
      },
      {
        icon:"🌟", title:"VIP Client Interest",
        desc:"A wealthy investor heard great things. Word is spreading.",
        effect: b => { b.rep = Math.min(100, b.rep + 4); },
        msg: "Reputation +4", kind:"good",
      },
    ];

    // ── Event factories ────────────────────────────────────────
    // Each event returns an object with: icon, title, details[],
    // approveLabel, denyLabel (optional), single (bool),
    // canApprove(), onApprove(), onDeny()

    function makeLoanEvent() {
      const name    = pick(NAMES);
      const purpose = pick(PURPOSES);
      const amount  = randInt(5, 80) * 1_000;
      const risk    = pick(["low","medium","high"]);
      const termMo  = pick([6, 12, 24, 36]);
      const termDays = termMo * 30;
      const rates   = { low: 0.06, medium: 0.12, high: 0.20 };
      const rate    = rates[risk];
      const totalInt = amount * rate * (termMo / 12);
      const dailyPay = (amount + totalInt) / termDays;
      const riskColour = { low:"green", medium:"yellow", high:"red" }[risk];

      return {
        icon: "📝",
        eventType: "Loan Application",
        title: name,
        details: [
          { key:"Purpose",  val: purpose },
          { key:"Amount",   val: fmt(amount) },
          { key:"Risk",     val: risk.toUpperCase(), cls: riskColour },
          { key:"Term",     val: `${termMo} months` },
          { key:"Interest", val: `${(rate*100).toFixed(0)}% annual → ${fmt(totalInt)} total` },
          { key:"Your income", val: `${fmt(dailyPay)}/day`, cls:"green" },
        ],
        approveLabel: "✅ Approve",
        denyLabel:    "❌ Deny",
        single: false,
        canApprove: () => bank.cash >= amount,
        cantMsg: "Not enough cash to fund this loan.",
        onApprove() {
          bank.cash     -= amount;
          bank.loansOut += amount;
          bank.loanBook.push({ principal: amount, termDays, daysLeft: termDays, dailyPay });
          const bump = risk === "low" ? 2 : 1;
          bank.rep = Math.min(100, bank.rep + bump);
          return { msg:`Loan of ${fmt(amount)} approved. Reputation +${bump}.`, kind:"good" };
        },
        onDeny() {
          if (risk === "low") {
            bank.rep = Math.max(0, bank.rep - 2);
            return { msg:"Low-risk applicant turned away. Reputation −2.", kind:"warn" };
          }
          return { msg:"Risky applicant denied. Sensible call.", kind:"neutral" };
        },
      };
    }

    function makeDepositEvent() {
      const who    = pick(DEPOSITORS);
      const amount = randInt(20, 150) * 1_000;
      return {
        icon: "💰",
        eventType: "Deposit Offer",
        title: who,
        details: [
          { key:"Amount", val: fmt(amount) },
          { key:"Effect", val: "Boosts cash, increases liability" },
        ],
        approveLabel: "✅ Accept",
        denyLabel:    "❌ Decline",
        single: false,
        canApprove: () => true,
        onApprove() {
          bank.cash     += amount;
          bank.deposits += amount;
          bank.rep = Math.min(100, bank.rep + 1);
          return { msg:`Deposit of ${fmt(amount)} accepted. Reputation +1.`, kind:"good" };
        },
        onDeny() {
          return { msg:`Deposit from ${who} declined.`, kind:"neutral" };
        },
      };
    }

    function makeWithdrawalEvent() {
      const amount = randInt(5, 50) * 1_000;
      const canPay = () => bank.cash >= amount;
      return {
        icon: "🏧",
        eventType: "Withdrawal Request",
        title: `${fmt(amount)} requested`,
        details: [
          { key:"Amount", val: fmt(amount) },
          { key:"Status", val: canPay() ? "Funds available" : "⚠️ Low cash!", cls: canPay() ? "green" : "red" },
        ],
        approveLabel: "✅ Process",
        denyLabel:    "❌ Refuse",
        single: false,
        canApprove: () => true,
        onApprove() {
          if (!canPay()) {
            bank.rep = Math.max(0, bank.rep - 10);
            return { msg:`Couldn't pay ${fmt(amount)} — funds short. Reputation −10.`, kind:"bad" };
          }
          bank.cash     -= amount;
          bank.deposits  = Math.max(0, bank.deposits - amount);
          return { msg:`Withdrawal of ${fmt(amount)} processed.`, kind:"neutral" };
        },
        onDeny() {
          bank.rep = Math.max(0, bank.rep - 6);
          return { msg:`Refused withdrawal. Customer furious. Reputation −6.`, kind:"bad" };
        },
      };
    }

    function makeRandomEvent() {
      const ev = pick(RANDOM_EVENTS);
      return {
        icon: ev.icon,
        eventType: "Random Event",
        title: ev.title,
        details: [{ key:"Detail", val: ev.desc }],
        approveLabel: "Acknowledge",
        single: true,
        canApprove: () => true,
        onApprove() {
          ev.effect(bank);
          return { msg: ev.msg, kind: ev.kind };
        },
      };
    }

    // ── Build a day's event queue ──────────────────────────────
    let queue = [];   // events for today
    let qIdx  = 0;   // which event we're on

    function buildDay() {
      const events = [];
      if (Math.random() < 0.85) events.push(makeLoanEvent());
      if (Math.random() < 0.60) events.push(makeLoanEvent());
      if (Math.random() < 0.65) events.push(makeDepositEvent());
      events.push(makeWithdrawalEvent());
      if (Math.random() < 0.45) events.push(makeRandomEvent());
      // shuffle
      queue = events.sort(() => Math.random() - 0.5);
      qIdx  = 0;
    }

    // ── Render: stats ──────────────────────────────────────────
    function renderStats() {
      const r = bank.rep;
      const nw = netWorth();

      document.getElementById("dayLabel").textContent    = `Day ${bank.day}`;
      document.getElementById("netWorth").textContent    = fmt(nw);
      document.getElementById("netWorth").style.color    = nw >= 0 ? "var(--green)" : "var(--red)";
      document.getElementById("statCash").textContent    = fmt(bank.cash);
      document.getElementById("statCash").style.color    =
        bank.cash < 20_000 ? "var(--red)" : bank.cash < 80_000 ? "var(--yellow)" : "var(--green)";
      document.getElementById("statLoans").textContent   = fmt(bank.loansOut);
      document.getElementById("statDeposits").textContent = fmt(bank.deposits);

      const profEl = document.getElementById("statProfit");
      profEl.textContent  = fmt(bank.profit);
      profEl.style.color  = bank.profit >= 0 ? "var(--green)" : "var(--red)";

      document.getElementById("statRep").textContent = `${r} / 100`;
      document.getElementById("statRep").style.color =
        r >= 50 ? "var(--green)" : r >= 30 ? "var(--yellow)" : "var(--red)";

      const fill = document.getElementById("repFill");
      fill.style.width = `${r}%`;
      fill.style.background =
        r >= 50 ? "var(--green)" : r >= 30 ? "var(--yellow)" : "var(--red)";
    }

    // ── Render: progress dots ──────────────────────────────────
    function renderDots() {
      const container = document.getElementById("dots");
      container.innerHTML = queue.map((_, i) => {
        const cls = i < qIdx ? "done" : i === qIdx ? "current" : "";
        return `<div class="dot ${cls}"></div>`;
      }).join("");
    }

    // ── Render: event card ─────────────────────────────────────
    function renderEvent() {
      const card = document.getElementById("eventCard");

      // All events for the day handled — show end-of-day summary
      if (qIdx >= queue.length) {
        const loanIncome = bank.loanBook.reduce((s, l) => s + l.dailyPay, 0);
        const depInt     = bank.deposits * 0.000055;
        card.innerHTML = `
          <div class="event-head">
            <div class="event-icon">🌙</div>
            <div class="event-meta">
              <div class="type">End of Day</div>
              <div class="title">Day ${bank.day} Complete</div>
            </div>
          </div>
          <div class="event-body">
            <div class="eod-row"><span class="key">Loan repayments in</span><span style="color:var(--green)">+${fmt(loanIncome)}</span></div>
            <div class="eod-row"><span class="key">Deposit interest out</span><span style="color:var(--red)">−${fmt(depInt)}</span></div>
            <div class="eod-row"><span class="key">Daily overhead</span><span style="color:var(--red)">−${fmt(DAILY_OVERHEAD)}</span></div>
          </div>
          <div class="btn-row one-col">
            <button class="btn btn-purple" onclick="advanceDay()">Next Day →</button>
          </div>`;
        document.getElementById("dots").innerHTML = "";
        return;
      }

      const ev = queue[qIdx];
      const ok = ev.canApprove();

      const detailsHtml = ev.details.map(d =>
        `<div class="detail-row">
           <span class="key">${d.key}</span>
           <span class="val ${d.cls||''}">${d.val}</span>
         </div>`
      ).join("");

      const cantHtml = (!ok && ev.cantMsg)
        ? `<div class="cant-fund">${ev.cantMsg}</div>` : "";

      const btnsHtml = ev.single
        ? `<div class="btn-row one-col">
             <button class="btn btn-green" onclick="act('approve')">${ev.approveLabel}</button>
           </div>`
        : `${cantHtml}
           <div class="btn-row two-col">
             <button class="btn btn-dark"  onclick="act('deny')">${ev.denyLabel}</button>
             <button class="btn btn-green" onclick="act('approve')" ${!ok?"disabled":""}>${ev.approveLabel}</button>
           </div>`;

      card.innerHTML = `
        <div class="ev-timer-wrap"><div class="ev-timer-fill" id="evTimerFill"></div></div>
        <div class="event-head">
          <div class="event-icon">${ev.icon}</div>
          <div class="event-meta">
            <div class="type">${ev.eventType}</div>
            <div class="title">${ev.title}</div>
          </div>
        </div>
        <div class="event-body">${detailsHtml}</div>
        ${btnsHtml}`;

      renderDots();
    }

    // ── Action handler (approve / deny) ───────────────────────
    function act(choice) {
      const ev  = queue[qIdx];
      const res = choice === "approve" ? ev.onApprove() : ev.onDeny();
      addLog(res.msg, res.kind);
      qIdx++;
      renderStats();
      renderEvent();
      if (checkLose()) return;
    }

    // ── End-of-day: collect payments, pay interest, overhead ──
    function advanceDay() {
      let loanIncome = 0;

      bank.loanBook = bank.loanBook.filter(loan => {
        const repayment = loan.principal / loan.termDays;
        bank.cash     += loan.dailyPay;
        bank.loansOut -= repayment;
        bank.profit   += loan.dailyPay - repayment;
        loanIncome    += loan.dailyPay;
        loan.daysLeft--;
        return loan.daysLeft > 0;
      });

      bank.loansOut = Math.max(0, bank.loansOut);

      const depInt = bank.deposits * 0.000055;
      bank.cash   -= depInt;
      bank.profit -= depInt;
      bank.cash   -= DAILY_OVERHEAD;
      bank.profit -= DAILY_OVERHEAD;

      addLog(
        `Day ${bank.day} closed. Loan income +${fmt(loanIncome)}, overhead −${fmt(DAILY_OVERHEAD)}.`,
        "neutral"
      );

      bank.day++;

      if (checkLose()) return;

      buildDay();
      renderStats();
      renderEvent();

      // Scroll event card into view on mobile
      document.getElementById("eventCard").scrollIntoView({ behavior:"smooth", block:"nearest" });
    }

    // ── Win / lose checks ──────────────────────────────────────
    function checkLose() {
      if (bank.cash <= 0) {
        showOverlay(
          "lose", "💸", "Bankrupt!",
          "Your cash reserves hit zero. The regulators have taken over.",
          `<div class="overlay-stat">Survived <strong>${bank.day} days</strong></div>
           <div class="overlay-stat">Final assets: <strong>${fmt(totalAssets())}</strong></div>`
        );
        return true;
      }
      if (bank.rep <= 15) {
        showOverlay(
          "lose", "🏃", "Bank Run!",
          "Customers lost faith and withdrew everything. The bank is finished.",
          `<div class="overlay-stat">Survived <strong>${bank.day} days</strong></div>
           <div class="overlay-stat">Final reputation: <strong>${bank.rep}/100</strong></div>`
        );
        return true;
      }
      return false;
    }

    // ── Overlay helper ─────────────────────────────────────────
    function showOverlay(kind, icon, title, body, statsHtml) {
      document.getElementById("overlayIcon").textContent    = icon;
      document.getElementById("overlayTitle").textContent   = title;
      document.getElementById("overlayTitle").className     = `overlay-title ${kind}`;
      document.getElementById("overlayBody").textContent    = body;
      document.getElementById("overlayStats").innerHTML     = statsHtml;
      document.getElementById("overlay").classList.add("show");
    }

    // ── Log ────────────────────────────────────────────────────
    function addLog(msg, kind) {
      const list = document.getElementById("logList");
      const el   = document.createElement("div");
      el.className = `log-item ${kind}`;
      el.innerHTML = `<div class="day-tag">Day ${bank.day}</div>${msg}`;
      list.prepend(el);
      while (list.children.length > 25) list.removeChild(list.lastChild);
    }

    // ── Restart ────────────────────────────────────────────────
    function restartGame() {
      stopTimers();
      document.getElementById("overlay").classList.remove("show");
      document.getElementById("logList").innerHTML = "";
      initBank();
      buildDay();
      renderStats();
      renderEvent();
      startTimers();
    }

    // ── Boot ───────────────────────────────────────────────────
    initBank();
    buildDay();
    renderStats();
    renderEvent();
    startTimers();
  </script>

</body>
</html>
