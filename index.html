<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bank Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <h1>🏦 First National Bank</h1>
      <div class="day-row">
        <p id="dayLabel">Day 1</p>
        <span class="day-time" id="dayTime">1:30</span>
      </div>
    </div>
    <div class="header-right">
      <div class="header-nw">
        <div class="label">Net Worth</div>
        <div class="value" id="netWorth">$200,000</div>
      </div>
      <button class="menu-btn" onclick="openMenu()">☰</button>
    </div>
  </header>

  <!-- ── Day timer bar ──────────────────────────────────────── -->
  <div class="day-timer-wrap">
    <div class="day-timer-fill" id="dayTimerFill"></div>
  </div>

  <!-- ── Stats ──────────────────────────────────────────────── -->
  <div class="stats">
    <div class="stat">
      <div class="label">Cash Reserves</div>
      <div class="value green" id="statCash">$500,000</div>
    </div>
    <div class="stat">
      <div class="label">Loans Out</div>
      <div class="value blue" id="statLoans">$0</div>
    </div>
    <div class="stat">
      <div class="label">Deposits Owed</div>
      <div class="value yellow" id="statDeposits">$300,000</div>
    </div>
    <div class="stat">
      <div class="label">Total Profit</div>
      <div class="value green" id="statProfit">$0</div>
    </div>
    <div class="stat full-width">
      <div class="rep-row">
        <div class="label">Reputation</div>
        <div class="value green" id="statRep" style="font-size:15px">60 / 100</div>
      </div>
      <div class="rep-track">
        <div class="rep-fill" id="repFill"></div>
      </div>
    </div>
  </div>

  <!-- ── Current event ──────────────────────────────────────── -->
  <div class="section">
    <div class="section-label">Today's Event</div>
    <div class="event-card" id="eventCard"></div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- ── Bank branch floor view ─────────────────────────────── -->
  <div class="floor-section">
    <div class="floor-header">
      <div class="section-label" style="margin-bottom:0">Branch Floor</div>
      <span class="floor-hint" id="floorHint">Select an upgrade below to place it</span>
    </div>
    <div class="floor-grid-wrap">
      <div id="floorGrid"></div>
    </div>
    <div class="shop-label">Upgrades Shop</div>
    <div class="shop-scroll" id="shopGrid"></div>
  </div>

  <!-- ── Activity log ───────────────────────────────────────── -->
  <div class="section">
    <div class="section-label">Activity Log</div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- ── Menu overlay ──────────────────────────────────────── -->
  <div class="overlay" id="menuOverlay">
    <div class="overlay-box menu-box">
      <div class="menu-header">
        <span class="menu-title">Menu</span>
        <button class="menu-close-btn" onclick="closeMenu()">✕</button>
      </div>

      <div class="menu-section-label">Save Slots</div>
      <div id="menuSlots"></div>

      <div class="menu-divider"></div>

      <div id="restartArea">
        <button class="btn btn-dark menu-full-btn" onclick="confirmRestart()">🔄 Restart New Game</button>
      </div>
    </div>
  </div>

  <!-- ── Win / Lose overlay ─────────────────────────────────── -->
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="overlay-icon"  id="overlayIcon"></div>
      <div class="overlay-title" id="overlayTitle"></div>
      <div class="overlay-body"  id="overlayBody"></div>
      <div class="overlay-stats" id="overlayStats"></div>
      <div class="btn-row one-col">
        <button class="btn btn-blue" onclick="restartGame()">Play Again</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts (order matters: dependencies first) ────────── -->
  <script src="js/constants.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/events.js"></script>
  <script src="js/render.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/floor.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
